<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
  <circle cx="20" cy="20" r="20" fill="#1b1f24"/>
  <!-- antenna -->
  <line x1="20" y1="13" x2="20" y2="9" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <circle cx="20" cy="8" r="1.5" fill="white"/>
  <!-- robot head -->
  <rect x="11" y="13" width="18" height="14" rx="4" fill="none" stroke="white" stroke-width="2"/>
  <!-- side connectors -->
  <line x1="11" y1="20" x2="8" y2="20" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <line x1="29" y1="20" x2="32" y2="20" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <!-- eyes -->
  <circle cx="16" cy="19" r="2" fill="white"/>
  <circle cx="24" cy="19" r="2" fill="white"/>
  <!-- smile -->
  <path d="M16,24 Q20,27 24,24" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
</svg>
