accelerators:
  - id: constituent-services-agent
    title: Constituent Services Agent
    order: 1
    url: /guides/01-constituent-services-agent/
    summary: Resident-facing assistant for benefits, permits, schedules, and civic FAQs.
  - id: document-eligibility-agent
    title: Document Eligibility Agent
    order: 2
    url: /guides/02-document-eligibility-agent/
    summary: Document intake, extraction, and eligibility triage for program workflows.
  - id: emergency-response-agent
    title: Emergency Response Agent
    order: 3
    url: /guides/03-emergency-response-agent/
    summary: Multi-agent emergency coordination using weather and resource readiness signals.
  - id: policy-compliance-checker
    title: Policy Compliance Checker
    order: 4
    url: /guides/04-policy-compliance-checker/
    summary: Governance and compliance scoring with weighted remediation planning.
  - id: inter-agency-knowledge-hub
    title: Inter-Agency Knowledge Hub
    order: 5
    url: /guides/05-inter-agency-knowledge-hub/
    summary: Cross-department retrieval with RBAC-aware information boundaries.
  - id: virtual-citizen-assistant-dotnet
    title: Virtual Citizen Assistant (.NET to Foundry)
    order: 6
    url: /guides/06-virtual-citizen-assistant-dotnet/
    summary: Migration path from ASP.NET and plugins to a Foundry-native assistant.
  - id: virtual-citizen-assistant-python
    title: Virtual Citizen Assistant (Python to Foundry)
    order: 7
    url: /guides/07-virtual-citizen-assistant-python/
    summary: Migration path from Flask and plugins to a Foundry-native assistant.
  - id: professional-license-credential-verifier
    title: Professional License Credential Verifier
    order: 8
    url: /guides/08-professional-license-credential-verifier/
    summary: Automated credential extraction and validation for state licensing boards.
  - id: unemployment-claims-processor
    title: Unemployment Claims Processor
    order: 9
    url: /guides/09-unemployment-claims-processor/
    summary: Rapid UI and workers' compensation claims processing with Document Intelligence.

questions:
  - id: tooling
    prompt: What's your primary technology focus?
    options:
      - id: document-intelligence
        label: Document intelligence—extract and process submitted forms and documents
        weights:
          document-eligibility-agent: 5
          professional-license-credential-verifier: 5
          unemployment-claims-processor: 5
          policy-compliance-checker: 2
          constituent-services-agent: 1
        reasons:
          document-eligibility-agent: This is purpose-built for document extraction and intelligent processing.
          professional-license-credential-verifier: Extracts credentials from transcripts, exam results, and background checks.
          unemployment-claims-processor: Extracts wage data, separation letters, and medical reports for rapid processing.
          policy-compliance-checker: This also supports document-based compliance analysis.
      - id: multi-agent
        label: Multi-agent solutions—coordinate multiple specialists or teams
        weights:
          emergency-response-agent: 5
          inter-agency-knowledge-hub: 4
          policy-compliance-checker: 1
        reasons:
          emergency-response-agent: This is the strongest fit for coordinated multi-agent workflows.
          inter-agency-knowledge-hub: This handles cross-team coordination with access control.
      - id: chatbot
        label: Conversational AI—build a chatbot or intelligent assistant
        weights:
          constituent-services-agent: 5
          virtual-citizen-assistant-dotnet: 5
          virtual-citizen-assistant-python: 5
          inter-agency-knowledge-hub: 2
        reasons:
          constituent-services-agent: This is optimized for high-quality assistant conversations.
          virtual-citizen-assistant-dotnet: This is a ready-made migration blueprint for chatbots.
          virtual-citizen-assistant-python: This is a ready-made migration blueprint for chatbots.
      - id: public-facing
        label: Public-facing services—deliver solutions to residents or citizens
        weights:
          constituent-services-agent: 5
          virtual-citizen-assistant-dotnet: 4
          virtual-citizen-assistant-python: 4
          document-eligibility-agent: 3
          inter-agency-knowledge-hub: 2
        reasons:
          constituent-services-agent: This is built for resident-facing service delivery.
          virtual-citizen-assistant-dotnet: This supports public-facing citizen assistant delivery.
          virtual-citizen-assistant-python: This supports public-facing citizen assistant delivery.
          document-eligibility-agent: This can power intake and eligibility services for the public.

  - id: organization
    prompt: Where do you want to create business impact first?
    options:
      - id: city-services
        label: Improve resident service and self-service support
        weights:
          constituent-services-agent: 5
          virtual-citizen-assistant-dotnet: 3
          virtual-citizen-assistant-python: 3
          inter-agency-knowledge-hub: 2
          document-eligibility-agent: 2
        reasons:
          constituent-services-agent: This aligns with improving front-door resident service outcomes.
          virtual-citizen-assistant-dotnet: This can also fit a resident assistant modernization path.
          virtual-citizen-assistant-python: This can also fit a resident assistant modernization path.
      - id: social-intake
        label: Accelerate benefits and social services delivery
        weights:
          document-eligibility-agent: 5
          unemployment-claims-processor: 5
          constituent-services-agent: 2
          inter-agency-knowledge-hub: 2
          virtual-citizen-assistant-python: 2
        reasons:
          document-eligibility-agent: This is the strongest fit for intake throughput and eligibility decisions.
          unemployment-claims-processor: Designed for rapid UI and workers' compensation claim intake and routing.
      - id: meteorology-emergency
        label: Improve emergency readiness and coordinated response
        weights:
          emergency-response-agent: 5
          inter-agency-knowledge-hub: 2
          policy-compliance-checker: 1
        reasons:
          emergency-response-agent: This is purpose-built for emergency planning and rapid coordination.
      - id: governance-office
        label: Strengthen policy compliance and risk oversight
        weights:
          policy-compliance-checker: 5
          inter-agency-knowledge-hub: 2
          document-eligibility-agent: 1
        reasons:
          policy-compliance-checker: This maps directly to governance, scoring, and remediation needs.

  - id: outcome
    prompt: What result matters most in the next 90 days?
    options:
      - id: answers-and-actions
        label: Faster resident answers and fewer handoffs
        weights:
          constituent-services-agent: 5
          virtual-citizen-assistant-dotnet: 4
          virtual-citizen-assistant-python: 4
          inter-agency-knowledge-hub: 2
        reasons:
          constituent-services-agent: This accelerator is optimized for faster resident support outcomes.
      - id: extract-and-route
        label: Shorter intake cycle times for submitted documents
        weights:
          document-eligibility-agent: 5
          unemployment-claims-processor: 5
          professional-license-credential-verifier: 4
          policy-compliance-checker: 2
          constituent-services-agent: 1
        reasons:
          document-eligibility-agent: This directly reduces manual review and routing effort.
          unemployment-claims-processor: Processes UI/WC claims in 24-48 hours via rapid extraction and routing.
          professional-license-credential-verifier: Routes credentials to licensing database within hours, not weeks.
      - id: phased-response
        label: Better real-time decisions during incidents
        weights:
          emergency-response-agent: 5
          inter-agency-knowledge-hub: 2
        reasons:
          emergency-response-agent: This focuses on incident response quality and speed.
      - id: compliance-report
        label: Clear compliance reports and prioritized actions
        weights:
          policy-compliance-checker: 5
          inter-agency-knowledge-hub: 2
          document-eligibility-agent: 1
        reasons:
          policy-compliance-checker: This delivers structured compliance findings and next-step priorities.

  - id: architecture
    prompt: How will your team mainly use this accelerator?
    options:
      - id: single-agent
        label: A single high-value assistant experience
        weights:
          constituent-services-agent: 5
          professional-license-credential-verifier: 4
          unemployment-claims-processor: 4
          virtual-citizen-assistant-dotnet: 3
          virtual-citizen-assistant-python: 3
        reasons:
          constituent-services-agent: This is a strong fit for a single high-value assistant experience.
          professional-license-credential-verifier: Single agent handles all credential verification tasks.
          unemployment-claims-processor: Single agent processes all UI and WC claims efficiently.
      - id: connected-specialists
        label: Multiple specialists working together on complex cases
        weights:
          emergency-response-agent: 5
          inter-agency-knowledge-hub: 3
        reasons:
          emergency-response-agent: This supports coordinated specialist workflows under pressure.
      - id: multi-index-rbac
        label: Multiple departments with strict information boundaries
        weights:
          inter-agency-knowledge-hub: 5
          policy-compliance-checker: 2
          unemployment-claims-processor: 2
        reasons:
          inter-agency-knowledge-hub: This is designed for cross-department collaboration with clear boundaries.
          policy-compliance-checker: This best supports consistent scoring and leadership reporting.
          unemployment-claims-processor: Provides standardized benefit calculations and overpayment detection reports.
      - id: scoring-analytics
        label: Standardized scoring and executive-ready reporting
        weights:
          policy-compliance-checker: 5
          document-eligibility-agent: 2
        reasons:
          policy-compliance-checker: This best supports consistent scoring and leadership reporting.

  - id: migration
    prompt: What is your current build or migration starting point?
    options:
      - id: new-build
        label: Starting a new initiative and need a quick win
        weights:
          constituent-services-agent: 3
          document-eligibility-agent: 3
          professional-license-credential-verifier: 3
          unemployment-claims-processor: 3
          emergency-response-agent: 2
          policy-compliance-checker: 2
          inter-agency-knowledge-hub: 2
        reasons:
          constituent-services-agent: This is a practical quick-win starting point for new programs.
          professional-license-credential-verifier: Delivers quick wins with 70-80% auto-approval in first week.
          unemployment-claims-processor: Rapid deployment with 24-48 hour claim processing from day one.
      - id: modernize-dotnet
        label: Modernizing an existing .NET solution
        weights:
          virtual-citizen-assistant-dotnet: 5
          constituent-services-agent: 2
          policy-compliance-checker: 1
        reasons:
          virtual-citizen-assistant-dotnet: This is purpose-built for .NET modernization to Foundry.
      - id: modernize-python
        label: Modernizing an existing Python solution
        weights:
          virtual-citizen-assistant-python: 5
          constituent-services-agent: 2
          document-eligibility-agent: 1
        reasons:
          virtual-citizen-assistant-python: This is purpose-built for Python modernization to Foundry.
      - id: cross-agency
        label: Aligning multiple agencies around a shared service model
        weights:
          inter-agency-knowledge-hub: 5
          policy-compliance-checker: 2
          emergency-response-agent: 1
        reasons:
          inter-agency-knowledge-hub: This is built for cross-agency collaboration and knowledge sharing.
